[project]
name = "shopease-copilot"
version = "0.1.0"
description = "AI customer-support copilot for ShopEase, with an LLM gateway, observability, evals and LLMOps around it."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.19.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]
