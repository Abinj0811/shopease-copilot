[project]
name = "shopease-copilot"
version = "0.1.0"
description = "AI customer-support copilot for ShopEase, with an LLM gateway, observability, evals and LLMOps around it."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "faker>=40.39.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.19.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.1",
    "streamlit>=1.64.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[tool.pytest.ini_options]
# Put the repo root on sys.path so tests can import copilot, common, data and scripts.
pythonpath = ["."]
