services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopease}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-shopease}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:v1.102.1
    restart: unless-stopped
    command: ["--config", "/app/config.yaml"]
    environment:
      OLLAMA_API_BASE: ${OLLAMA_API_BASE}
      GROQ_API_KEY: ${GROQ_API_KEY}
      LITELLM_DATABASE_URL: ${LITELLM_DATABASE_URL}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_OTEL_V2: "true"
      PHOENIX_COLLECTOR_ENDPOINT: grpc://phoenix:4317
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-shopease-copilot}
      # Without this, the OTel gRPC exporter defaults to TLS and every export
      # fails (SSL_ERROR_SSL: WRONG_VERSION_NUMBER) against Phoenix's plaintext
      # collector. Standard OTel SDK env var, read directly by
      # opentelemetry-exporter-otlp-proto-grpc, not litellm-specific.
      OTEL_EXPORTER_OTLP_TRACES_INSECURE: "true"

      # Redis response cache (litellm_settings.cache_params in gateway/config.yaml).
      # The compose service name and its in-container port, not REDIS_HOST/
      # REDIS_PORT from .env: those are the host-side values the scripts use.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./gateway/config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4000/health/liveliness', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: started only with `docker compose --profile obs up -d`, so the
  # default stack stays small on an 8 GB machine.
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["obs"]
    restart: unless-stopped
    volumes:
      # Scrape config, and the bearer token it points at. The token holds
      # LITELLM_MASTER_KEY (/metrics is an admin route) and is gitignored --
      # it must never be committed. Both read-only: Prometheus only reads them.
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/litellm_token:/etc/prometheus/litellm_token:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:13.2.2
    profiles: ["obs"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - grafana_data:/var/lib/grafana
      # Datasource + dashboard provisioning (observability/grafana/provisioning).
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSON files the provider above loads (path: in dashboards.yml).
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:20.16.0
    profiles: ["obs"]
    restart: unless-stopped
    environment:
      # SQLite in the named volume, not the shared Postgres.
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix_data:/mnt/data
    ports:
      # UI + OTLP/HTTP collector.
      - "127.0.0.1:${PHOENIX_PORT:-6006}:6006"
      # OTLP/gRPC collector. Exposed to the host (not just the compose
      # network) because copilot/api.py currently runs on the host, not in
      # Docker; a future OTel exporter there needs 127.0.0.1 reachability.
      - "127.0.0.1:${PHOENIX_GRPC_PORT:-4317}:4317"
    healthcheck:
      # The image has no shell and no wget/curl (exec-only, python3 present),
      # unlike the other services here -- same reason as litellm's healthcheck.
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:6006/healthz', timeout=3)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  phoenix_data:
