model_list:
  - model_name: cheap
    litellm_params:
      model: ollama_chat/qwen3:1.7b
      api_base: os.environ/OLLAMA_API_BASE
      # Local CPU inference is slow: a ~1,400-token tool-calling request took
      # 27 s warm and 47 s cold, so this is the fallback's time budget.
      timeout: 100

  - model_name: strong
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      # Groq normally answers in seconds; fail fast and fall back to cheap.
      timeout: 30

  - model_name: embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: os.environ/OLLAMA_API_BASE

litellm_settings:
  # The OpenAI SDK always sends an encoding_format on embeddings requests
  # (base64 by default), and Ollama's embedding endpoint rejects that param
  # outright. drop_params tells LiteLLM to silently drop params a provider
  # doesn't support instead of erroring, which is LiteLLM's own documented
  # fix for this exact case.
  drop_params: true

  # Response cache in Redis. Identical requests (same model, messages and
  # params) are answered from cache instead of the provider, which is what
  # CLAUDE.md's zero-budget rule asks for so eval re-runs are free. Host and
  # port come from REDIS_HOST/REDIS_PORT in the litellm service's environment
  # (docker-compose.yml), which point at the compose service, not 127.0.0.1.
  cache: true
  cache_params:
    type: redis
    ttl: 3600
    # Embeddings are cached too: re-indexing unchanged policy docs then costs
    # nothing and returns identical vectors.
    supported_call_types: ["acompletion", "completion", "aembedding", "embedding"]

  # Prometheus metrics, served by the proxy itself on /metrics (same port as
  # the API, LITELLM_PORT). Not enterprise-gated in this version: request,
  # latency, token, spend and fallback metrics are all in the open-source build.
  #
  # arize_phoenix sends per-request LLM traces to the self-hosted Phoenix
  # collector (B9). It maps to LiteLLM's OpenTelemetry logger and needs three
  # env vars this file cannot set (confirmed in the installed litellm source,
  # litellm/integrations/arize/arize_phoenix.py and integrations/otel/model/
  # config.py): LITELLM_OTEL_V2, PHOENIX_COLLECTOR_ENDPOINT and
  # PHOENIX_PROJECT_NAME, all on the litellm service in docker-compose.yml.
  callbacks:
    - prometheus
    - arize_phoenix
  # Since v1.85 /metrics requires a LiteLLM key by default. Kept on (the secure
  # default, stated explicitly like disable_spend_logs below); a scraper must
  # then send `Authorization: Bearer <key>`.
  require_auth_for_metrics_endpoint: true

# Reliability. When a `strong` call fails (429, 5xx, timeout, connection error),
# the same deployment is retried num_retries times, then the request falls back
# to `cheap`. Tool-calling requests fall back too: `cheap` honours `tools`.
# Worst case before the fallback answers is about strong's two timeouts (60 s)
# plus one cheap call (27-47 s), which must stay under the copilot API's own
# client timeout (request_timeout_seconds in config/copilot.yaml).
router_settings:
  fallbacks: [{"strong": ["cheap"]}]
  num_retries: 1
  timeout: 30 # default for aliases without their own timeout (embed)

general_settings:
  database_url: os.environ/LITELLM_DATABASE_URL
  # Spend tracking is automatic once a database is connected; set explicitly
  # so the intent from this step is visible in the file, not just implicit.
  disable_spend_logs: false
