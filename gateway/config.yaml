model_list:
  - model_name: cheap
    litellm_params:
      model: ollama_chat/qwen3:1.7b
      api_base: os.environ/OLLAMA_API_BASE

  - model_name: strong
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY

  - model_name: embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: os.environ/OLLAMA_API_BASE
