# Prometheus scrape config for the LiteLLM gateway.
# Used by the prometheus service added in a later step (compose profile "obs").
#
# Auth: LiteLLM treats /metrics as an ADMIN route, so a team virtual key is
# refused (401) and only LITELLM_MASTER_KEY works. Prometheus does not expand
# environment variables outside global.external_labels, so the key cannot come
# from .env: it is read at scrape time from credentials_file, which you create
# yourself and which is gitignored. No key is ever written in this file.

global:
  # How often every job below is scraped; single place to change the rate.
  scrape_interval: 30s
  # How long one scrape may take before it is abandoned (must stay <= scrape_interval).
  scrape_timeout: 10s

scrape_configs:
  - job_name: litellm
    # Trailing slash on purpose: /metrics is a mounted sub-app that answers 307
    # to /metrics/. Prometheus would follow that (follow_redirects defaults to
    # true), but scraping the final path skips a round trip every interval and
    # keeps the target honest if that default is ever changed.
    metrics_path: /metrics/
    scheme: http
    authorization:
      type: Bearer
      # File you create (see docs/CONFIG.md); one line, the master key, no quotes.
      # Mounted read-only into the Prometheus container in the step that adds it.
      credentials_file: /etc/prometheus/litellm_token
    static_configs:
      # Compose service name and the proxy's in-container port: Prometheus runs
      # inside the same network, so 127.0.0.1 or LITELLM_PORT would not resolve.
      - targets: ["litellm:4000"]
